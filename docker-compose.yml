# Local development infrastructure for WatchGoblin.
#   docker compose up -d
# Port 5433 is used on purpose so this never collides with a Postgres install
# already listening on the default 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: watchgoblin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchgoblin
      POSTGRES_PASSWORD: watchgoblin
      POSTGRES_DB: watchgoblin
    ports:
      - "5442:5432"
    volumes:
      - watchgoblin-pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchgoblin -d watchgoblin"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  watchgoblin-pgdata:
