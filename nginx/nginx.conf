# Load balancer for the two app instances.
#
# The point of this file is not throughput — it is that requests genuinely
# alternate between containers, so anything the app keeps in process memory is
# visibly wrong rather than quietly wrong. Curl /api/health in a loop and watch
# the `instance` field change.

upstream watchgoblin {
    # Round robin, deliberately not ip_hash. Sticky sessions would paper over
    # exactly the per-instance state problems this stack exists to expose, and
    # sessions here are database rows, so nothing needs pinning.
    server app1:3000;
    server app2:3000;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Uploads are capped at 4 MB by the storage layer; rejecting oversize
    # bodies here means they never reach a Node process at all.
    client_max_body_size 5m;

    # Server Actions validate the Origin header, and `getClientIp` reads
    # X-Forwarded-For for rate-limit keys. Both are wrong without these.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Streamed server components arrive in chunks; buffering them would hold the
    # whole response back and undo the point of the Suspense boundaries.
    proxy_buffering off;

    location / {
        proxy_pass http://watchgoblin;
        proxy_read_timeout 300s;
    }

    # Immutable build assets, named by content hash. Long-lived caching is safe
    # precisely because a new build produces new filenames.
    location /_next/static/ {
        proxy_pass http://watchgoblin;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Readiness, not liveness: this proves the instance can reach the database.
    # Kept out of the access log so a 30-second probe does not bury real traffic.
    location = /api/health {
        proxy_pass http://watchgoblin;
        access_log off;
    }
}
